name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install stable debug keystore (keeps app data across updates)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Set app version (2.1.x) and versionCode
        run: |
          # versionName = 2.1.<n> y versionCode = 21000 + <n>, con n = número de ejecución.
          # Siempre sube, nunca se repite: Android actualiza sobre la app instalada
          # (misma firma + mismo id) y conserva tus datos, sin pedir desinstalar.
          RUN=${{ github.run_number }}
          NEW_VERSION="2.1.$RUN"
          NEW_CODE=$((21000 + RUN))
          sed -i -E "s/ version=\"[0-9.]+\"/ version=\"$NEW_VERSION\"/" config.xml
          sed -i -E "s/android-versionCode=\"[0-9]+\"/android-versionCode=\"$NEW_CODE\"/" config.xml
          echo "Nueva versión: $NEW_VERSION (code $NEW_CODE)"
          grep '<widget' config.xml

      - name: Clean stale platform files
        run: rm -rf platforms plugins

      - name: Add Android platform
        run: cordova platform add android@15.1.0

      - name: Build debug APK
        run: cordova build android

      - name: Locate generated APK files (debug helper)
        run: find platforms -iname "*.apk" -o -iname "*.aab" 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blues-apk
          path: |
            platforms/android/**/*.apk
            platforms/android/**/*.aab
          if-no-files-found: warn
